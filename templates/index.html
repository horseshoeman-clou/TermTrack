<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">

    <title>TermTrack</title>
    
    <link rel="stylesheet" href="/static/style.css">

</head>

<body>
    <div class="container">
        
        <h1>TermTrack</h1>
        <p class="subtitle">Upload your shell history. See what you actually type.</p>

        <form id="upload-form" enctype="multipart/form-data">
            <select name="source" id="source">
                <option value="bash">Bash</option>
                <option value="custom-shell">Custom Shell</option>
            </select>
            <input type="file" name="history" id="history" accept=".txt, .bash_history">

            <button type="submit">Analyze</button>
        </form>

        <div id="result"></div>
    </div>

    <script src="/static/script.js"></script>

</body>
</html>
